# PUBLICA O SITE imigrarbrasil.com NO CLOUDPANEL.
#
# Dispara de três jeitos:
#   · o botão "Publicar" do painel (repository_dispatch "publicar-site");
#   · push que mexe em site/ na main (mudança de código do site);
#   · à mão, na aba Actions do GitHub (workflow_dispatch).
#
# O que faz: busca o conteúdo do painel (/api/site/exportar), gera o HTML com o Astro e
# envia por rsync+SSH para a pasta do site no CloudPanel.
#
# SEGREDOS (Settings → Secrets and variables → Actions):
#   PAINEL_URL          https://… do imigrar-agent (sem barra no fim)
#   SITE_EXPORT_TOKEN   o mesmo valor configurado no painel (Vercel)
#   SSH_HOST            IP ou domínio do servidor do CloudPanel
#   SSH_USER            o usuário do site no CloudPanel (Sites → imigrarbrasil.com → Users)
#   SSH_KEY             chave PRIVADA cuja pública está em ~/.ssh/authorized_keys desse usuário
#   SSH_PATH            /home/<usuario>/htdocs/imigrarbrasil.com
#   SSH_PORT            opcional (padrão 22)

name: Publicar site

on:
  repository_dispatch:
    types: [publicar-site]
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/publicar-site.yml"]

# Duas publicações seguidas: a segunda espera a primeira, e a do meio é descartada. Nunca
# dois rsync ao mesmo tempo na mesma pasta.
concurrency:
  group: publicar-site
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci

      - name: Conteúdo do painel
        env:
          PAINEL_URL: ${{ secrets.PAINEL_URL }}
          SITE_EXPORT_TOKEN: ${{ secrets.SITE_EXPORT_TOKEN }}
        run: npm run puxar-conteudo

      - name: Gerar o site
        env:
          # Para onde o site manda os cliques e visitas (aba Site do painel).
          PUBLIC_PAINEL_URL: ${{ secrets.PAINEL_URL }}
        run: npm run build

      - name: Enviar ao CloudPanel
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PATH: ${{ secrets.SSH_PATH }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          install -m 600 /dev/null ~/.ssh_key && printf '%s\n' "$SSH_KEY" > ~/.ssh_key
          mkdir -p ~/.ssh && ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          # --delete apaga do servidor o que saiu do site; o proxy de leads (api/lead.php)
          # está em dist/, então continua lá. O arquivo de segredo fica FORA de SSH_PATH.
          rsync -az --delete --exclude ".well-known" \
            -e "ssh -i ~/.ssh_key -p $SSH_PORT" \
            dist/ "$SSH_USER@$SSH_HOST:$SSH_PATH/"
          rm -f ~/.ssh_key
