# VHOST COMPLETO DO SITE NO CLOUDPANEL
#
# Sites → imigrarbrasil.com → Vhost → APAGUE TUDO que está lá e cole este arquivo inteiro.
# As {{variáveis}} são preenchidas pelo próprio CloudPanel ao salvar — não troque.
#
# O que este vhost faz, comparado ao padrão do CloudPanel para "PHP Site":
#  · entrega o HTML direto pelo nginx, sem Varnish (site estático: o Varnish só atrasaria
#    a atualização depois de cada upload);
#  · PHP só para /api/lead.php e /admin/ — nada de index.php pegando toda URL;
#  · página que não existe responde 404 de verdade (com a 404.html do site);
#  · redireciona as URLs antigas do WordPress (tags, feed, sitemaps do Yoast…);
#  · entrega WebP no mesmo endereço do JPG/PNG para quem aceita;
#  · imigrarbrasil.com.br e www → https://imigrarbrasil.com.

# Fica FORA dos server { }: o nginx só aceita `map` aqui.
map $http_accept $imigrar_webp {
  default   "";
  "~*webp"  ".webp";
}

# ── www, .com.br e www.com.br → https://imigrarbrasil.com ──────────────────────
server {
  listen 80;
  listen [::]:80;
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  {{ssl_certificate_key}}
  {{ssl_certificate}}
  server_name www.imigrarbrasil.com imigrarbrasil.com.br www.imigrarbrasil.com.br;

  # O Let's Encrypt precisa validar estes domínios antes do redirecionamento.
  location ^~ /.well-known/ {
    {{root}}
    auth_basic off;
    allow all;
  }
  location / {
    return 301 https://imigrarbrasil.com$request_uri;
  }
}

# ── o site ──────────────────────────────────────────────────────────────────────
server {
  listen 80;
  listen [::]:80;
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  {{ssl_certificate_key}}
  {{ssl_certificate}}
  server_name imigrarbrasil.com;
  {{root}}

  {{nginx_access_log}}
  {{nginx_error_log}}

  location ^~ /.well-known/ {
    auth_basic off;
    allow all;
  }

  if ($scheme != "https") {
    return 301 https://$host$request_uri;
  }

  index index.html;
  error_page 404 /404.html;
  # Redirecionamentos relativos: o navegador mantém o https.
  absolute_redirect off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;

  gzip on;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/xml application/xml application/rss+xml application/javascript application/json image/svg+xml;

  # ── URLs do WordPress que não existem mais: 301 para o equivalente ─────────────
  # Tags → página de tema do mesmo assunto (site/src/lib/blog.ts). A primeira que casar vence.
  location ~ ^/tag/[^/]*(naturaliza|nacionalidade|cidadania|nato)[^/]*/?$ { return 301 /blog-imigracao-brasil/tema/naturalizacao/; }
  location ~ ^/tag/[^/]*(visto|vitem|vivis|nomade|working-holiday)[^/]*/?$ { return 301 /blog-imigracao-brasil/tema/vistos/; }
  location ~ ^/tag/[^/]*(residencia|residente|arb|retorno)[^/]*/?$ { return 301 /blog-imigracao-brasil/tema/residencia/; }
  location ~ ^/tag/[^/]*(crnm|rnm|cpf|apostil|traducao|documento|conta|migranteweb|cnh|pid)[^/]*/?$ { return 301 /blog-imigracao-brasil/tema/documentos/; }
  location ~ ^/tag/[^/]*(familia|familiar|filho|casamento|divorcio|uniao|conjuge)[^/]*/?$ { return 301 /blog-imigracao-brasil/tema/familia/; }
  location ~ ^/tag/[^/]*(trabalho|emprego|executivo|engenheir|profissional|aposentadoria|maritimo)[^/]*/?$ { return 301 /blog-imigracao-brasil/tema/trabalho/; }
  location ~ ^/tag/[^/]*(estud|universidade|diploma|revalida|intercambio|equivalencia)[^/]*/?$ { return 301 /blog-imigracao-brasil/tema/estudo/; }
  location ~ ^/tag/[^/]*(invest|empresa|negocio|banco-central|ied|sce|capital|imovel|imobiliari|golden|remessa|cambio|fiscal|imposto|cnpj)[^/]*/?$ { return 301 /blog-imigracao-brasil/tema/investimentos/; }
  location ~ ^/tag/[^/]*(regulariza|expuls|impedid|overstay|multa|recurso|atras|refugi|asilo|humanitari|acolhida)[^/]*/?$ { return 301 /blog-imigracao-brasil/tema/regularizacao/; }
  location ~ ^/tag/[^/]*(mercosul|cplp|portugal|lusofon)[^/]*/?$ { return 301 /blog-imigracao-brasil/tema/mercosul-cplp/; }
  # Prefixo SEM ^~: com ^~ o nginx pararia aqui e nunca testaria as regex de cima.
  location /tag/                  { return 301 /blog-imigracao-brasil/; }
  location ^~ /category/          { return 301 /blog-imigracao-brasil/; }
  location ^~ /author/            { return 301 /equipe/walter-gama/; }
  location = /manutencao/         { return 301 /; }
  location = /teste/              { return 301 /; }
  location = /depoimento/         { return 301 /quem-somos/; }
  location = /servico/            { return 301 /nossos-servicos/; }
  location = /categoria-servico/  { return 301 /nossos-servicos/; }
  location = /landingpage/        { return 301 /landingpage/ebook/; }
  # Feed e sitemaps do Yoast (o Search Console tem /sitemap_index.xml cadastrado).
  location ~ ^/(feed|comments/feed)/?$ { return 301 /rss.xml; }
  location ~ ^/[^/]+/feed/?$           { return 301 /rss.xml; }
  location ~ "^/(sitemap_index|wp-sitemap|sitemap|[a-z_-]+-sitemap[0-9]*)\.xml$" { return 301 /sitemap-index.xml; }
  # Robôs procurando WordPress: 410 (sumiu de vez).
  location ~ ^/(wp-admin|wp-login\.php|xmlrpc\.php|wp-json|wp-includes|wp-cron\.php) { return 410; }

  # ── o /admin do blog (PHP, public/admin/index.php) ─────────────────────────────
  # Tudo em /admin/ vai para um arquivo só; nada de lá é servido direto, exceto o CSS e o JS.
  # "= /admin" e "^~ /admin/" (com a barra): um prefixo "/admin" sem barra pegaria artigos
  # como /administrativo-…/.
  location = /admin { return 301 /admin/; }
  location ^~ /admin/estatico/ {
    add_header Cache-Control "public, max-age=300";
    try_files $uri =404;
  }
  location ^~ /admin/ {
    client_max_body_size 20m;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/admin/index.php;
    fastcgi_param SCRIPT_NAME /admin/index.php;
    fastcgi_param HTTPS on;
    fastcgi_pass 127.0.0.1:{{php_fpm_port}};
  }

  # ── o formulário ──────────────────────────────────────────────────────────────
  location = /api/lead.php {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param HTTPS on;
    fastcgi_pass 127.0.0.1:{{php_fpm_port}};
  }
  location ^~ /api/ { return 404; }
  # Qualquer outro .php (index.php padrão, tentativas de invasão): não existe.
  # .dados/ (o que o /admin grava) cai na regra dos arquivos ocultos, logo abaixo.
  location ~ \.php$ { return 404; }
  # Arquivos ocultos (.env, .git…), exceto .well-known.
  location ~ /\.(?!well-known) { deny all; }

  # ── arquivos ──────────────────────────────────────────────────────────────────
  # Build do Astro, com hash no nome: cache de um ano.
  location ^~ /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  # Tamanhos extras do WordPress (foto-768x432.jpg) que foram apagados: entrega o original.
  location ~ "^(?<base>/wp-content/uploads/.+)-[0-9]+x[0-9]+\.(?<ext>jpe?g|png|gif|webp)$" {
    add_header Cache-Control "public, max-age=2592000";
    add_header Vary Accept;
    try_files $uri$imigrar_webp $uri $base.$ext$imigrar_webp $base.$ext =404;
  }
  # JPG/PNG: entrega foto.jpg.webp no mesmo endereço para quem aceita WebP.
  location ~* \.(?:png|jpe?g)$ {
    add_header Cache-Control "public, max-age=2592000";
    add_header Vary Accept;
    try_files $uri$imigrar_webp $uri =404;
  }
  location ~* \.(?:webp|gif|svg|ico|woff2?)$ {
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
  }

  # ── páginas ───────────────────────────────────────────────────────────────────
  location / {
    # Sem barra no fim → com barra (a URL canônica tem barra, como no WordPress).
    rewrite ^([^.]*[^/])$ $1/ permanent;
    try_files $uri $uri/index.html =404;
    # HTML muda a cada publicação: o navegador confere sempre.
    add_header Cache-Control "public, max-age=0, must-revalidate";
  }
}
